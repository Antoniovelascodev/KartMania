<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../css/formularios/iniSesion.css">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="../index.html"><img id="logo" src="../images/logoKartmania.jpg" alt="Logo Kartmania"></a>
    </header>
    <main>
        <section id="logosLoginCarritoEspañaUK"> 
                <div id="banderaUk">
                    <a href="iniSesionEN.html"><img src="../images/banderaUk.png" alt="English"></a>
                </div> 
            </section>
        <form class="cajaLogin" novalidate>
            <section>
                <h1>INICIA SESIÓN</h1>
            </section>
            <section id="camposRellenar">
                <p id="rellenarEmail">Introduzca su email:</p>
                <input type="email" placeholder="usuario@ejemplo.com" required>
                <p id="rellenarContraseña">Introduzca su contraseña:</p>
                <input id="contraseña" type="password" placeholder="Contraseña" required>
                <button id="botonIniciarSesion" type="submit">Iniciar sesión</button>
            </section>
            <br>
            <br>
            <br>
            <hr>
            <section>
                <p id="pregunta">¿No tienes cuenta? <a id="Registrar" href="registro.html">Regístrate aquí!</a></p>
            </section>
        </form>
    </main>
</body>
</html>
