<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar</title>
    <link rel="stylesheet" href="../css/formularios/registro.css">
</head>
<body>
    <header>
        <a href="../index.html"><img id="logo" src="../images/logoKartmania.jpg" alt="Logo Kartmania"></a>
    </header>
    <main>
        <section id="logosLoginCarritoEspañaUK"> 
                <div id="banderaUk">
                    <a href="registroEN.html"><img src="../images/banderaUk.png" alt="English"></a>
                </div> 
            </section>
        <form class="cajaLogin" novalidate>
            <section>
                <h1>REGÍSTRATE</h1>
            </section>
            <section id="camposRellenar">
                <p id="rellenarNombre">Introduzca su nombre:</p>
                <input type="text" placeholder="Nombre" required>
                <p id="rellenarApellidos">Introduzca sus apellidos:</p>
                <input type="text" placeholder="Apellidos" required>
                <p id="rellenarEmail">Introduzca su email:</p>
                <input type="email" placeholder="usuario@ejemplo.com" required>
                <p id="rellenarContraseña">Introduzca su contraseña:</p>
                <input id="contraseña" type="password" placeholder="Contraseña" required>
                <p id="rellenarContraseña2">Introduzca su contraseña de nuevo:</p>
                <input id="contraseña2" type="password" placeholder="Repite la contraseña" required>
                <div class="checkbox-wrapper">
                    <p><input id="condiciones" type="checkbox" required> He leído y acepto la política de privacidad</p>
                </div>
                <button id="botonRegistrar" type="submit">Registrarse</button>
                <p class="volver-texto"><a id="backLogin" href="iniSesion.html">Volver al inicio de sesión</a></p>
            </section>
        </form>
    </main>
</body>
</html>
