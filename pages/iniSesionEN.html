<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../css/formularios/iniSesion.css">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="../index.html"><img id="logo" src="../images/logoKartmania.jpg" alt="Logo Kartmania"></a>
    </header>
    <main>
        <section id="logosLoginCarritoEspañaUK"> 
            <div id="banderaEspaña">
                <a href="iniSesion.html"><img src="../images/banderaEspana.png" alt="Español"></a>
            </div> 
        </section>
        <form class="cajaLogin" novalidate>
            <section>
                <h1>LOG IN</h1>
            </section>
            <section id="camposRellenar">
                <p id="rellenarEmail">Enter your email:</p>
                <input type="email" placeholder="user@example.com" required>
                <p id="rellenarContraseña">Enter your password:</p>
                <input id="contraseña" type="password" placeholder="Password" required>
                <button id="botonIniciarSesion" type="submit">Log in</button>
            </section>
            <br>
            <br>
            <br>
            <hr>
            <section>
                <p id="pregunta">Don't have an account? <a id="Registrar" href="registroEN.html">Register here!</a></p>
            </section>
        </form>
    </main>
</body>
</html>
